name: gates

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-and-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Vitest (shared/ golden-file + invariant tests, mobile/src/lib pure modules)
        run: npm run test

      - name: Engine parity (push worker vs shared/prayer-engine.ts)
        run: npm run parity

      # `npm run validate` is intentionally NOT run in CI: it calls out to the
      # live Aladhan API (see scripts/validate.mts). That's fine locally, but
      # a flaky or rate-limited third-party API should never fail a CI gate
      # for a change that has nothing to do with it. Run `npm run validate`
      # locally before releasing a change to shared/prayer-engine.ts.

  mobile-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Typecheck mobile/
        working-directory: mobile
        run: npx tsc --noEmit
